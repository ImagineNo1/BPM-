services:
  mongodb:
    image: mongo:7
    container_name: bpm-studio-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bpm_studio
    volumes:
      - bpm_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bpm-studio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bpm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bpm_mongodb_data:
  bpm_redis_data:
